<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VSLA SAFE v5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial;background:#f0f0f0;text-align:center}.top{background:#1a3a2a;color:white;padding:20px}.box{background:white;max-width:400px;margin:20px auto;padding:20px;border-radius:10px}input{width:90%;padding:10px;margin:5px}button{background:#1a3a2a;color:white;padding:10px 20px;border:none;cursor:pointer;margin:5px}.hidden{display:none}</style>
</head><body>
<div class="top"><h1>VSLA SAFE 🔒 v5</h1><p id="welcome">Please Log In</p><h2 id="total"><span id="totalBox">Total in Box: </span></h2><p id="balance">My Balance: Saved: <span id="mySaved">0</span> | Loan: <span id="myLoan">0</span> | Net: <span id="myNet">0</span></p>
<div id="memberList" style="display:none; background:white; color:black; padding:15px; border-radius:10px; margin-top:15px; text-align:left;"></div>
<div class="box" id="authBox">
<h3>Login / Sign Up</h3>
<input id="email" placeholder="Email e.g. amina@gmail.com">
<input id="pass" type="password" placeholder="Password">
<input id="fullName" placeholder="Full Name e.g. Amina Nakato">
<label><input type="checkbox" id="isChair" style="width:auto"> I am Chairperson - I can see all</label>
<br><br><button onclick="signUp()" style="background:#1a3a2a;color:white">SIGN UP</button><br><hr>
<br><button onclick="signIn()">LOGIN</button>
<p id="authMsg" style="color:red"></p>
</div>

<div class="box hidden" id="mainBox">
<h3>My Balance - Only You Can See This</h3>
<p>Saved: <b id="mySaved">0</b> | Loan Left: <b id="myLoan">0</b> | Net: <b id="myNet">0</b></p> <input id="amount" type="number" placeholder="Amount e.g. 10000">
<br><br>
<button onclick="addTx('saving')">ADD SAVING</button>
<button onclick="addTx('loan')">ADD LOAN</button>
<button onclick="addTx('repay')">PAY LOAN</button>
<p id="txMsg" style="color:green"></p>
<button onclick="logout()">LOGOUT</button>
</div>

<script>
const supabaseClient = supabase.createClient('https://nvifqvixjvcfoflnqdle.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52aWZxdml4anZjZm9mbG5xZGxlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NDk4NDA1NywiZXhwIjoyMTEwNTYwMDU3fQ.O5TYy_XE974FVGS4nfYTqmoYzsb9neR8Zv2DdT3I1wQ');
let currentUser = null;

async function signUp(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;
  const fullName = document.getElementById('fullName').value;
  const isChair = document.getElementById('isChair').checked;
  const {data, error} = await supabaseClient.auth.signUp({email, password});
  if(error){ document.getElementById('authMsg').innerText = error.message; return; }
  if(data.user){
    await supabaseClient.from('members').insert([{id: data.user.id, email: email, full_name: fullName, is_chair: isChair}]);
    document.getElementById('authMsg').innerText = "Account created! Check email then LOGIN.";
  }
}

async function signIn(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;
  const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
  if(error){ document.getElementById('authMsg').innerText = error.message; return; }
  currentUser = data.user;
  document.getElementById('welcome').innerText = "Welcome " + email;
  document.getElementById('authBox').classList.add('hidden');
  document.getElementById('mainBox').classList.remove('hidden');loadBalance();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}
async function loadBalance(){
  const {data, error} = await supabaseClient.from('transactions').select('*');
  if(error){ document.getElementById('txMsg').innerText = 'Load error: ' + error.message; return; }
  let s=0, l=0;
  (data||[]).forEach(t=>{ if(t.type==='saving') s+=Number(t.amount); if(t.type==='loan') l+=Number(t.amount); if(t.type==='repay') l-=Number(t.amount); });
  document.getElementById('mySaved').innerText = s;
  document.getElementById('myLoan').innerText = l;
  document.getElementById('myNet').innerText = s - l;
  // Chairperson total
 const {data: total} = await supabaseClient.rpc('get_total_in_box');
const el = document.getElementById('totalBox') || document.getElementById('totalInBox');
const totalRow = document.getElementById('total');
if(total == null){ if(totalRow) totalRow.style.display = 'none'; }
else { if(totalRow) totalRow.style.display = ''; if(el) el.innerText = 'Total in Box: ' + total; }
// Chair member list - direct, no function
try {
  const {data: profs} = await supabaseClient.from('profiles').select('id, role, email');
  const {data: txs} = await supabaseClient.from('transactions').select('user_id, type, amount');
  const listEl = document.getElementById('memberList');
  if(listEl && profs && profs.length > 0){
    listEl.style.display = 'block';
    listEl.innerHTML = '<h3>All Members</h3>' + profs.map(p => {
      const myTxs = (txs || []).filter(t => t.user_id === p.id);
      const saved = myTxs.filter(t => t.type === 'saving').reduce((s,t) => s + Number(t.amount), 0);
      const loan = myTxs.filter(t => t.type === 'loan').reduce((s,t) => s + Number(t.amount), 0);
      const repay = myTxs.filter(t => t.type === 'repay').reduce((s,t) => s + Number(t.amount), 0);
      return `<div style="border-bottom:1px solid #ddd; padding:8px 0;"><b>${p.email || p.id.slice(0,8)}</b> (${p.role})<br>Saved: ${saved} | Loan: ${loan} | Net: ${saved - loan + repay}</div>`;
    }).join('');
  }
} catch(e) { console.log('member list error', e); }
  }
  async function addTx(type){
  const amt = Number(document.getElementById('amount').value);
  if(!amt || amt<=0){ document.getElementById('txMsg').innerText='Enter amount first'; return; }
  const {error} = await supabaseClient.from('transactions').insert([{member_id: currentUser.id, type: type, amount: amt}]);
  if(error){ document.getElementById('txMsg').innerText = error.message; return; }
  document.getElementById('txMsg').innerText = 'Saved!';
  document.getElementById('amount').value='';
  loadBalance();
}
window.addTx = addTx;
window.signIn = signIn;
window.signUp = signUp;
window.logout = logout;
console.log("SCRIPT LOADED OK");
</script>
</body></html>
